[project]
name = "derm-referral-ai"
version = "1.0.0"
description = "Derm-Referral AI Engine — skin lesion triage clinical decision support system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Derm-Referral AI Team" }]

dependencies = [
    # Deep Learning
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    # Image augmentation
    "albumentations>=1.4.0",
    # Windows workaround: stringzilla 5.1.2 has no cp311-win_amd64 wheel
    # (see https://github.com/ashvardanian/StringZilla/issues/333) and forces
    # a source build requiring MSVC 14+. Pin to 5.1.1 which has a wheel.
    "stringzilla==5.1.1; sys_platform == 'win32'",
    # Tabular meta-learner
    "lightgbm>=4.3.0",
    # Data processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    # 8-bit optimizer (VRAM savings) — Linux/CUDA only; train_vision.py
    # already falls back to standard AdamW when bitsandbytes is absent,
    # and bitsandbytes has no official Windows wheels.
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
    # API stack
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    # Image I/O
    "Pillow>=10.3.0",
    # Experiment tracking
    "wandb>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",   # async test client for FastAPI
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["api", "src"]

[tool.uv]
package = false
